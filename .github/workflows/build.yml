name: Build and Deploy Package

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check --strict dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: distributions
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: distributions
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Trusted Publishing (OIDC) is preferable but isn't correctly
          # registered on PyPI for this repo/workflow/environment yet (fails
          # with "invalid-publisher"). Using the existing PYPI_API_TOKEN
          # secret until that's fixed; see the project's Publishing settings
          # on pypi.org to re-enable OIDC and drop this token.
          password: ${{ secrets.PYPI_API_TOKEN }}
